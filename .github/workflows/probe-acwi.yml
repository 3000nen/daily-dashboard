name: Probe all-country data

# オールカントリー（オルカン）の値をサーバー側から取得できるか調べる一時的な調査用。
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Try Yahoo Finance symbols and eMAXIS NAV sources
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"

          yf() {
            echo "---- Yahoo: $1  ($2)"
            body=$(curl -sf -m 20 -H "User-Agent: $UA" \
              "https://query1.finance.yahoo.com/v8/finance/chart/$1?interval=1d&range=5d" || echo '')
            if [ -z "$body" ]; then echo "     取得失敗"; return; fi
            echo "$body" | jq -r '
              if .chart.result then
                .chart.result[0].meta |
                "     名称       : \(.shortName // .longName // "-")\n" +
                "     通貨/取引所 : \(.currency // "-") / \(.fullExchangeName // .exchangeName // "-")\n" +
                "     現在値     : \(.regularMarketPrice // "-")\n" +
                "     前日終値   : \(.chartPreviousClose // "-")\n" +
                "     相場時刻   : \(.regularMarketTime // "-")"
              else "     result無し: \(.chart.error // "?")" end'
          }

          yf '2559.T'  '国内ETF MAXIS全世界株式(オール・カントリー)'
          yf '2560.T'  '国内ETF MAXIS全世界株式(除く日本)'
          yf 'ACWI'    '米国ETF iShares MSCI ACWI'
          yf 'VT'      '米国ETF Vanguard Total World'

          echo
          echo "==== eMAXIS Slim 全世界株式(オール・カントリー) の基準価額CSV"
          for id in 253425 253266 0331418A; do
            url="https://emaxis.jp/client/csv_data/${id}.csv"
            code=$(curl -s -m 20 -o /tmp/e.csv -w '%{http_code}' -H "User-Agent: $UA" "$url")
            echo "---- $url -> HTTP $code  size=$(stat -c%s /tmp/e.csv 2>/dev/null || echo 0)"
            if [ "$code" = "200" ]; then
              echo "     先頭3行:"; head -3 /tmp/e.csv | sed 's/^/       /'
              echo "     末尾2行:"; tail -2 /tmp/e.csv | sed 's/^/       /'
            fi
          done

          echo
          echo "==== 投資信託協会 検索ページ（到達可否のみ）"
          curl -s -m 20 -o /dev/null -w "     toushin-lib: HTTP %{http_code}\n" \
            -H "User-Agent: $UA" "https://toushin-lib.fwg.ne.jp/FdsWeb/FDST030000?isinCd=JP90C000H1T1" || true
