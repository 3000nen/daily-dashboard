name: Update market data

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch indices, forex and gold from Yahoo Finance and build market-data.json
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"

          fetch_json() {
            curl -sf -H "User-Agent: $UA" \
              "https://query1.finance.yahoo.com/v8/finance/chart/$1?interval=1d&range=2d" \
              || echo '{"chart":{"result":null}}'
          }

          nikkei=$(fetch_json '%5EN225')
          dow=$(fetch_json '%5EDJI')
          # オールカントリー: eMAXIS Slimの基準価額CSVはサーバーからは403で取得できないため、
          # 同じMSCI ACWIに連動し円建てで東証に上場しているETF(2559)の価格で代替する。
          allcountry=$(fetch_json '2559.T')
          # 為替と金もYahoo Financeに寄せる。ECBの為替APIは営業日に1度しか更新されず
          # 前日比が出せない、金のAPIは前日終値を返さない、という制約があったため。
          usdjpy=$(fetch_json 'USDJPY%3DX')
          eurjpy=$(fetch_json 'EURJPY%3DX')
          gold=$(fetch_json 'GC%3DF')

          jq -n \
            --argjson nikkei "$nikkei" \
            --argjson dow "$dow" \
            --argjson allcountry "$allcountry" \
            --argjson usdjpy "$usdjpy" \
            --argjson eurjpy "$eurjpy" \
            --argjson gold "$gold" \
            --arg updatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '
            def pick: {
              price:      (try .chart.result[0].meta.regularMarketPrice catch null),
              prevClose:  (try .chart.result[0].meta.chartPreviousClose catch null),
              marketTime: (try .chart.result[0].meta.regularMarketTime catch null)
            };
            {
              updatedAt: $updatedAt,
              nikkei:   ($nikkei | pick),
              dow:        ($dow        | pick),
              allCountry: ($allcountry | pick),
              usdjpy:   ($usdjpy | pick),
              eurjpy:   ($eurjpy | pick),
              gold:     ($gold   | pick)
            }' > market-data.json

          cat market-data.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add market-data.json

          if git diff --cached --quiet; then
            echo "market-data.json に変更なし。コミットしない。"
            exit 0
          fi

          git commit -m "Update market data"

          # 他のpushと競合したときのために、rebaseしてから数回リトライする
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed (attempt $attempt)"
              exit 0
            fi
            echo "push に失敗。rebaseして再試行する (attempt $attempt)"
            git pull --rebase origin main || true
          done

          echo "3回試しても push できなかった" >&2
          exit 1
