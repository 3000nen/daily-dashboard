name: Probe weather API

# 時間別の降水確率がモデル指定の有無でどう変わるかを調べる一時的な調査用ワークフロー。
on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare Open-Meteo with and without models=jma_seamless
        run: |
          BASE="https://api.open-meteo.com/v1/forecast?latitude=34.6937&longitude=135.5023"
          FIELDS="&current=temperature_2m,weather_code&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max&timezone=Asia%2FTokyo&forecast_days=7"

          check() {
            echo "==== $1"
            curl -sS --max-time 25 "$2" -o /tmp/r.json -w '     HTTP %{http_code}\n'
            if jq -e '.error == true' /tmp/r.json >/dev/null 2>&1; then
              echo "     APIエラー: $(jq -r '.reason' /tmp/r.json)"; return
            fi
            echo "     hourly keys        : $(jq -c '.hourly | keys' /tmp/r.json)"
            echo "     pop 先頭12件        : $(jq -c '.hourly.precipitation_probability[0:12]' /tmp/r.json)"
            echo "     pop の非null件数    : $(jq '[.hourly.precipitation_probability[] | select(. != null)] | length' /tmp/r.json)"
            echo "     pop の総数          : $(jq '.hourly.precipitation_probability | length' /tmp/r.json)"
            echo "     daily pop_max      : $(jq -c '.daily.precipitation_probability_max' /tmp/r.json)"
            echo "     daily uv_index_max : $(jq -c '.daily.uv_index_max' /tmp/r.json)"
          }

          check "モデル指定あり (現在の設定: jma_seamless)" "${BASE}${FIELDS}&models=jma_seamless"
          check "モデル指定なし (おまかせ best_match)"      "${BASE}${FIELDS}"
          check "モデル指定 jma_msm"                        "${BASE}${FIELDS}&models=jma_msm"
